[project]
name = "failureforge"
version = "0.1.0"
description = "Reproducible robustness-testing framework for YOLO object detectors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]
authors = [{ name = "FailureForge" }]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0"]
optuna = ["optuna>=3.0"]
dev = ["pytest>=7.0", "optuna>=3.0"]

[project.scripts]
failureforge = "failureforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
